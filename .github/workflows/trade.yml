name: Delta Futures Production Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "* * * * *"

jobs:
  trade:
    runs-on: ubuntu-latest

    concurrency:
      group: delta-futures-bot
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dotenv

      - name: Run Delta Futures Production Bot
        env:
          DELTA_API_KEY: ${{ secrets.OWNER_API_KEY }}
          DELTA_API_SECRET: ${{ secrets.OWNER_API_SECRET }}
          DELTA_BASE_URL: ${{ secrets.DELTA_BASE_URL }}
        run: |
          python -u delta_futures_bot.py
